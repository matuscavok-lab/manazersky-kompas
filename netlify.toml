"$schema" = "https://open-api.netlify.com/netlify.schema.json"
# Netlify konfigurácia pre Manažérsky Kompas v0.9 (SPA fallback + PWA + Keygen Studio + Netlify Blobs Edge DB)

[build]
  command = "echo 'Prebuilt static dist ready'"
  publish = "dist"

[[edge_functions]]
  function = "license-db"
  path = "/api/license-db"

[[edge_functions]]
  function = "license-db"
  path = "/databaza-klucov.js"

[[edge_functions]]
  function = "license-db"
  path = "/databaza-klucov.json"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/generator-klucov.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/databaza-klucov.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/databaza-klucov.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/keygen"
  to = "/generator-klucov.html"
  status = 200

[[redirects]]
  from = "/generator"
  to = "/generator-klucov.html"
  status = 200

[[redirects]]
  from = "/generator-klucov"
  to = "/generator-klucov.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
