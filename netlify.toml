"$schema" = "https://open-api.netlify.com/netlify.schema.json"
# Netlify konfigurácia pre Manažérsky Kompas v0.9 (SPA fallback + PWA + Zabezpečené Edge API)

[build]
  command = "rm -rf dist/generator-klucov* dist/GeneratorKlucov* dist/databaza-klucov* dist/databaza-uzivatelov* generator-klucov* GeneratorKlucov* databaza-klucov* databaza-uzivatelov* netlify/edge-functions/license-db.js netlify/edge-functions/users-db.js && echo 'Prebuilt static dist ready (sanitized)'"
  publish = "dist"

[[edge_functions]]
  function = "auth-api"
  path = "/api/auth/*"

[[edge_functions]]
  function = "license-api"
  path = "/api/license/*"

[[edge_functions]]
  function = "admin-api"
  path = "/api/admin/*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/generator-klucov*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/GeneratorKlucov*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/databaza-klucov*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/databaza-uzivatelov*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/license-db"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/users-db"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
